# Builds the Android APK of Time Rush Nebula on GitHub Actions.
#
# Required repository secrets (Settings > Secrets and variables > Actions). Their values are
# never printed; the job fails with the names of any that are missing.
#   UNITY_LICENSE   - contents of the Unity_lic.ulf licence file from a machine where Unity Hub
#                     is signed in (a Personal licence works)
#   UNITY_EMAIL     - the Unity account e-mail
#   UNITY_PASSWORD  - the Unity account password
#
# Optional upload-key signing (all four or none; see docs/release/ANDROID_SIGNING.md):
#   ANDROID_KEYSTORE_BASE64 - the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASS   - keystore password
#   ANDROID_KEYALIAS_NAME   - key alias inside the keystore
#   ANDROID_KEYALIAS_PASS   - key password
# With them, the APK is signed with the upload key and a Play Store bundle (.aab) is built too.
# Without them, the APK is signed with the CI runner's Android debug key: installable for testing,
# not a store-signed release, and no .aab is produced.
#
# Every push to main or feat/time-rush-v2: EditMode tests, then a release (non-development) APK
# uploaded as a workflow artifact. A GitHub pre-release is only published from a manual run
# (Actions > Build Android APK > Run workflow) with "publish_prerelease" ticked.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built APK as a GitHub pre-release
        type: boolean
        default: false
  push:
    branches: [main, feat/time-rush-v2]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS != '' }}
      HAS_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME != '' }}
      HAS_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS != '' }}
    steps:
      - name: Check required Unity secrets
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity secrets missing::Add these repository secrets under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
          echo "All required Unity secrets are present."

      - name: Check optional signing secrets
        id: signing
        run: |
          set -- "$HAS_KEYSTORE" "$HAS_KEYSTORE_PASS" "$HAS_KEYALIAS_NAME" "$HAS_KEYALIAS_PASS"
          count=0; for v in "$@"; do [ "$v" = "true" ] && count=$((count+1)); done
          if [ "$count" -eq 4 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Upload-key signing enabled: signed APK and Play Store AAB will be built."
          elif [ "$count" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Debug-signed build::No upload keystore secrets; the APK will be debug-signed and no AAB is built."
          else
            echo "::error title=Incomplete signing secrets::Set all four of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS, or none."
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          artifactsPath: test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Build APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildName: TimeRushNebula
          buildMethod: TimeRushBuild.BuildAndroidCI
          androidExportType: androidPackage
          versioning: Custom
          version: ${{ env.APP_VERSION }}
          androidVersionCode: ${{ env.APP_VERSION_CODE }}
          androidKeystoreName: ${{ steps.signing.outputs.enabled == 'true' && 'user.keystore' || '' }}
          androidKeystoreBase64: ${{ steps.signing.outputs.enabled == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          androidKeystorePass: ${{ steps.signing.outputs.enabled == 'true' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ steps.signing.outputs.enabled == 'true' && secrets.ANDROID_KEYALIAS_NAME || '' }}
          androidKeyaliasPass: ${{ steps.signing.outputs.enabled == 'true' && secrets.ANDROID_KEYALIAS_PASS || '' }}

      - name: Build Play Store bundle (AAB)
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildName: TimeRushNebula
          buildMethod: TimeRushBuild.BuildAndroidCI
          androidExportType: androidAppBundle
          versioning: Custom
          version: ${{ env.APP_VERSION }}
          androidVersionCode: ${{ env.APP_VERSION_CODE }}
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Verify APK
        run: |
          apk=$(ls build/Android/*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "::error title=No APK::The Unity build finished without producing build/Android/*.apk"
            exit 1
          fi
          ls -l "$apk"
          sha256sum "$apk" | tee build/Android/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TimeRushNebula-apk
          path: |
            build/Android/*.apk
            build/Android/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Play Store bundle
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: TimeRushNebula-aab
          path: build/Android/*.aab
          if-no-files-found: error

  publish:
    needs: android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TimeRushNebula-apk
          path: apk

      - name: Publish pre-release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-ci-${{ github.run_number }}
          name: Time Rush Nebula 1.0.${{ github.run_number }} (CI pre-release)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Automated CI build of ${{ github.sha }} (run ${{ github.run_id }}).
            EditMode tests passed in this run. Signed with the CI runner's Android debug key:
            installable for testing, not a store-signed release.
          files: |
            apk/*.apk
            apk/SHA256SUMS.txt
